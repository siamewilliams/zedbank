<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Account Detail</title></head>
<body>
<span layout:fragment="page-title">Account Detail</span>

<div layout:fragment="content">
    <div class="card mb-4">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h3 class="fw-bold mb-1" th:text="${account.customerName()}">Customer</h3>
                    <p class="text-muted mb-2">
                        Account: <strong th:text="${account.accountNumber()}"></strong>
                    </p>
                    <span class="badge bg-secondary me-1" th:text="${account.accountType()}"></span>
                    <span class="badge bg-success" th:text="${account.status()}"></span>
                </div>
                <div class="text-end">
                    <div class="text-muted small">Available Balance</div>
                    <h2 class="fw-bold text-success"
                        th:text="${account.currency()} + ' ' + ${#numbers.formatDecimal(account.balance(), 1, 'COMMA', 2, 'POINT')}"></h2>
                </div>
            </div>
        </div>
    </div>

    <a th:href="@{/web/statements(accountNumber=${account.accountNumber()})}" class="btn btn-outline-primary
