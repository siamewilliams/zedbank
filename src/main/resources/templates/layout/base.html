<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE · ZedBank">ZedBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="app-shell" sec:authorize="isAuthenticated()">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-bank2"></i> <span>ZedBank</span>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" th:href="@{/web/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="sidebar-link" th:href="@{/web/accounts}">
                <i class="bi bi-wallet2"></i> Accounts
            </a>
            <div class="sidebar-section" sec:authorize="hasAnyRole('ADMIN','TELLER')">
                <span>Operations</span>
            </div>
            <a class="sidebar-link" sec:authorize="hasAnyRole('ADMIN','TELLER')" th:href="@{/web/transactions/deposit}">
                <i class="bi bi-cash-coin"></i> Deposit
            </a>
            <a class="sidebar-link" sec:authorize="hasAnyRole('ADMIN','TELLER')" th:href="@{/web/transactions/transfer}">
                <i class="bi bi-arrow-left-right"></i> Transfer
            </a>
            <a class="sidebar-link" th:href="@{/web/transactions}">
                <i class="bi bi-journal-text"></i> Transactions
            </a>
            <a class="sidebar-link" th:href="@{/web/statements}">
                <i class="bi bi-file-earmark-text"></i> Statements
            </a>
            <div class="sidebar-section" sec:authorize="hasRole('ADMIN')">
                <span>Administration</span>
            </div>
            <a class="sidebar-link" sec:authorize="hasRole('ADMIN')" th:href="@{/web/audit}">
                <i class="bi bi-shield-check"></i> Audit Log
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="avatar" sec:authentication="name"></div>
                <div>
                    <div class="fw-semibold small" sec:authentication="name"></div>
                    <div class="text-muted small">
                        <span sec:authorize="hasRole('ADMIN')">Administrator</span>
                        <span sec:authorize="hasRole('TELLER')">Teller</span>
                        <span sec:authorize="hasRole('CUSTOMER')">Customer</span>
                    </div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light w-100 mt-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Sign out
                </button>
            </form>
        </div>
    </aside>

    <main class="content">
        <header class="content-header">
            <h1 class="page-title"><span layout:fragment="page-title">Dashboard</span></h1>
            <div class="page-actions"><span layout:fragment="page-actions"></span></div>
        </header>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div layout:fragment="content"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
